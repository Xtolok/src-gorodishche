{% extends 'base.html' %}



{% block content %}

<div class="page-top">

  <span class="badge">{{ page.badge }}</span>

  <h1>{{ page.h1 }}</h1>

  {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}

</div>



<div class="section current-content">

  {% if content.body_html %}

  {{ content.body_html|safe }}

  {% else %}

  <p>Содержимое будет добавлено.</p>

  {% endif %}

</div>

{% endblock %}
